<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOGE Crypto Mining Calculator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        .input-row {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            margin-bottom: 15px;
        }
        .input-group {
            flex: 1;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #f4f4f4;
        }
        canvas {
            margin-top: 30px;
            width: 100%;
            height: 400px;
        }
        /* Exempt checkbox and label from the above rules */
        .checkbox-label {
            display: inline-flex; /* Keep inline layout for checkbox */
            align-items: center; /* Vertical alignment */
            margin-bottom: 0; /* Remove bottom margin for alignment */
        }
        .checkbox-label input {
            width: auto; /* Prevent checkbox from taking full width */
            padding: 0; /* Remove padding for checkbox */
            margin-right: 5px; /* Optional: space between checkbox and label */
            transform: scale(1.3); /* Scale the checkbox */
            transform-origin: center; /* Ensure it scales from the center */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DOGE Crypto Mining Calculator</h1>
        <div class="input-row">
            <div class="input-group">
                <label for="multiplier">Unit(s) Multiplier:</label>
                <input type="number" id="multiplier" placeholder="1" step="1" value="1" min="1">
            </div>
            <div class="input-group">
                <label for="hashRate">Hash Rate (GH/s):</label>
                <input type="number" id="hashRate" placeholder="20.00" step="0.01" value="20.00" min="0">
            </div>
            <div class="input-group">
                <label for="power">Power (W):</label>
                <input type="number" id="power" placeholder="6200.00" step="0.01" value="6200.00" min="0">
            </div>
        </div>
        <div class="input-row">
            <div class="input-group">
                <label for="cost">Electricity Cost ($/kWh):</label>
                <input type="number" id="cost" placeholder="0.0747" step="0.01" value="0.0747" min="0">
            </div>
            <div class="input-group">
                <label for="deliveryChargeRate">Delivery Charge Rate:</label>
                <input type="number" id="deliveryChargeRate" placeholder="0.04" step="0.01" value="0.04" min="0">
            </div>
            <div class="input-group">
                <label for="providerCharge">Monthly Provider Charge:</label>
                <input type="number" id="providerCharge" placeholder="4.95" step="0.05" value="4.95" min="0">
            </div>
        </div>
        <div class="input-row">
            <div class="input-group">
                <label for="blockTime">Block Time (seconds):</label>
                <input type="number" id="blockTime" placeholder="1.3" step="0.01" value="1.3" min="0" disabled>
            </div>
            <div class="input-group">
                <label for="blockReward">Block Reward (DOGE):</label>
                <input type="number" id="blockReward" placeholder="10000" step="0.01" value="10000" min="0">
            </div>
            <div class="input-group">
                <label for="fees">Fees (%):</label>
                <input type="number" id="fees" placeholder="0.0" step="1.0" value="0.0" min="0">
            </div>
        </div>
        <div class="input-row">
            <div class="input-group">
                <label for="difficulty">Difficulty:</label>
                <input type="number" id="difficulty" placeholder="27527175.35" step="1000000.00" value="27527175.35" min="0">
            </div>
            <div class="input-group">
                <label for="dogeValue">DOGE Value:</label>
                <input type="number" id="dogeValue" placeholder="0.356022" step="0.01" value="0.356022" min="0">
            </div>
        </div>
        
        <div class="input-row">
            <button onclick="calculate()">Calculate</button>
            <button id="resetButton">Reset</button>
            <button id="updateDataButton">Get Current Data</button>
            <label for="useBlockAverage" class="checkbox-label">
                <input type="checkbox" id="useBlockAverage"> Use 60 Block Average (~1h)
            </label>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>Per</th>
                    <th>Fees</th>
                    <th>Est. Rewards</th>
                    <th>Rev. $</th>
                    <th>Power Cost</th>
                    <th>Delivery Cost</th>
                    <th>Profit</th>
                </tr>
            </thead>
            <tbody id="results">
                <tr>
                    <td colspan="7">No results yet</td>
                </tr>
            </tbody>
        </table>
        
        <br>
        <h2>Scaling Profitability Table</h2>
        <div class="input-row">
            <div class="input-group">
                <label for="minerCost">Miner Cost ($):</label>
                <input type="number" id="minerCost" placeholder="8000.00" step="1000.00" value="8000.00" min="0">
            </div>
            <div class="input-group">
                <label for="additionalFunds">Additional Monthly Funds ($):</label>
                <input type="number" id="additionalFunds" placeholder="10000" step="1000.00" value="10000" min="0">
            </div>
            <div class="input-group">
                <label for="targetMonths">Target Months:</label>
                <input type="number" id="targetMonths" placeholder="48" step="1" value="48" min="1">
            </div>
        </div>
        <div class="input-row">
            <div class="input-group">
                <label for="monthlyDifficultyIncrease">Monthly Addition In Difficulty:</label>
                <input type="number" id="monthlyDifficultyIncrease" placeholder="120000.00" step="10000" value="120000.00" min="0">
            </div>
            <div class="input-group">
                <label for="monthlyValueIncrease">Monthly Addition In Price ($):</label>
                <input type="number" id="monthlyValueIncrease" placeholder="0.014914" step="0.001" value="0.014914" min="0">
            </div>
            <div class="input-group">
                <label for="existingMiners">Existing Miners:</label>
                <input type="number" id="existingMiners" placeholder="1" step="1" value="1" min="0">
            </div>
        </div>
        
        <h3>Equipment Factoring</h3>
        
        <!-- Dry Cooler Checkbox -->
        <fieldset id="useDryCoolerFactoringBox">
            <legend>
                <label for="useDryCoolerFactoring" class="checkbox-label">
                    <input type="checkbox" id="useDryCoolerFactoring" checked="true" onclick="toggleGroupBoxEnabledState('useDryCoolerFactoringBox', this.checked)">
                    Dry Cooling
                </label>
            </legend>
                
            <!-- Dry Cooler Inputs -->
            <div class="input-row">
                <div class="input-group">
                    <label for="coolerCost">Dry Cooler Cost:</label>
                    <input type="number" id="coolerCost" placeholder="150000.00" step="50000.00" value="150000.00" min="0">
                </div>
                <div class="input-group">
                    <label for="coolerHeatTransfer">Heat Transfer (kW):</label>
                    <input type="number" id="coolerHeatTransfer" placeholder="2000" step="100" value="2000" min="0">
                </div>
                <div class="input-group">
                    <label for="coolerPower">Power (W):</label>
                    <input type="number" id="coolerPower" placeholder="43200" step="1000" value="43200" min="1">
                </div>
            </div>
        </fieldset>
            
        <!-- Racks Checkbox -->
        <fieldset id="useRackFactoringBox">
            <legend>
                <label for="useRackFactoring" class="checkbox-label">
                    <input type="checkbox" id="useRackFactoring" checked="true" onclick="toggleGroupBoxEnabledState('useRackFactoringBox', this.checked)">
                    Miner Racks
                </label>
            </legend>
                
            <!-- Rack Inputs -->
            <div class="input-row">
                <div class="input-group">
                    <label for="rackCost">Rack Cost ($):</label>
                    <input type="number" id="rackCost" placeholder="4000.00" step="500.00" value="4000.00" min="0">
                </div>
                <div class="input-group">
                    <label for="rackCapacity">Rack Capacity:</label>
                    <input type="number" id="rackCapacity" placeholder="20" step="5" value="20" min="0">
                </div>
                <div class="input-group">
                    <label for="existingRacks">Existing Racks:</label>
                    <input type="number" id="existingRacks" placeholder="1" step="1" value="1" min="0">
                </div>
            </div>
        </fieldset>
        
        <table>
            <thead>
                <tr>
                    <th>Month</th>
                    <th>Coolers</th>
                    <th>Racks</th>
                    <th>Miners</th>
                    <th>New Miners</th>
                    <th>DOGE Price</th>
                    <th>Monthly Profit</th>
                    <th>Delivery Cost</th>
                    <th>Annual Profit</th>
                    <th>Mining Difficulty</th>
                </tr>
            </thead>
            <tbody id="scalingResults">
                <tr>
                    <td colspan="10">No results yet</td>
                </tr>
            </tbody>
        </table>
        
        <canvas id="monthlyChart"></canvas>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const multiplierInput = document.getElementById('multiplier');
        const hashRateInput = document.getElementById('hashRate');
        const powerInput = document.getElementById('power');
        const costInput = document.getElementById('cost');
        const blockRewardInput = document.getElementById('blockReward');
        const feesInput = document.getElementById('fees');
        const blockTimeInput = document.getElementById('blockTime');
        const difficultyInput = document.getElementById('difficulty');
        const dogeValueInput = document.getElementById('dogeValue');
        const resetButton = document.getElementById('resetButton');
        const minerCostInput = document.getElementById('minerCost');
        const additionalFundsInput = document.getElementById('additionalFunds');
        const targetMonthsInput = document.getElementById('targetMonths');
        const monthlyDifficultyIncreaseInput = document.getElementById('monthlyDifficultyIncrease');
        const monthlyValueIncreaseInput = document.getElementById('monthlyValueIncrease');
        const deliveryChargeRateInput = document.getElementById('deliveryChargeRate');
        const providerChargeInput = document.getElementById('providerCharge');
        const existingMinersInput = document.getElementById('existingMiners');
        const updateDataButton = document.getElementById('updateDataButton');
        const useBlockAverageCheckbox = document.getElementById('useBlockAverage');
        const useDryCoolerFactoringCheckbox = document.getElementById('useDryCoolerFactoring');
        const useRackFactoringCheckbox = document.getElementById('useRackFactoring');
        const coolerCostInput = document.getElementById('coolerCost');
        const coolerHeatTransferInput = document.getElementById('coolerHeatTransfer');
        const coolerPowerInput = document.getElementById('coolerPower');
        const rackCostInput = document.getElementById('rackCost');
        const rackCapacityInput = document.getElementById('rackCapacity');
        const existingRacksInput = document.getElementById('existingRacks');
        
        // Event listener for the reset button
        resetButton.addEventListener('click', () => {
            // Reset all fields to their original values
            document.getElementById('multiplier').value = document.getElementById('multiplier').placeholder;
            document.getElementById('hashRate').value = document.getElementById('hashRate').placeholder;
            document.getElementById('power').value = document.getElementById('power').placeholder;
            document.getElementById('cost').value = document.getElementById('cost').placeholder;
            document.getElementById('blockReward').value = document.getElementById('blockReward').placeholder;
            document.getElementById('fees').value = document.getElementById('fees').placeholder;
            document.getElementById('blockTime').value = document.getElementById('blockTime').placeholder;
            document.getElementById('difficulty').value = document.getElementById('difficulty').placeholder;
            document.getElementById('dogeValue').value = document.getElementById('dogeValue').placeholder;
            document.getElementById('minerCost').value = document.getElementById('minerCost').placeholder;
            document.getElementById('additionalFunds').value = document.getElementById('additionalFunds').placeholder;
            document.getElementById('targetMonths').value = document.getElementById('targetMonths').placeholder;
            document.getElementById('monthlyDifficultyIncrease').value = document.getElementById('monthlyDifficultyIncrease').placeholder;
            document.getElementById('monthlyValueIncrease').value = document.getElementById('monthlyValueIncrease').placeholder;
            document.getElementById('deliveryChargeRate').value = document.getElementById('deliveryChargeRate').placeholder;
            document.getElementById('providerCharge').value = document.getElementById('providerCharge').placeholder;
            document.getElementById('existingMiners').value = document.getElementById('existingMiners').placeholder;            
            document.getElementById('coolerCost').value = document.getElementById('coolerCost').placeholder;
            document.getElementById('coolerHeatTransfer').value = document.getElementById('coolerHeatTransfer').placeholder;
            document.getElementById('coolerPower').value = document.getElementById('coolerPower').placeholder;
            document.getElementById('rackCost').value = document.getElementById('rackCost').placeholder;
            document.getElementById('rackCapacity').value = document.getElementById('rackCapacity').placeholder;
            document.getElementById('existingRacks').value = document.getElementById('existingRacks').placeholder;
            
            // Recalculate with default values
            calculate();
        });

        // Variables to store the last user input values
        let lastHashRate = parseFloat(hashRateInput.value) || 20.0; // Default to 20.0 if empty
        let lastPower = parseFloat(powerInput.value) || 6200.0; // Default to 6200 if empty

        // Update hashRate and power based on multiplier value
        function updateHashAndPower() {
            const multiplier = parseFloat(multiplierInput.value) || 1;

            // Update hashRate and power based on the last user input and multiplier
            hashRateInput.value = (lastHashRate * multiplier).toFixed(2);
            powerInput.value = (lastPower * multiplier).toFixed(2);

            calculate(); // Recalculate whenever the multiplier changes
        }

        // Recalculate when hashRate or power changes
        hashRateInput.addEventListener('input', () => {
            lastHashRate = parseFloat(hashRateInput.value) || 20.0; // Store the new hashRate value
            multiplierInput.value = 1; // Reset multiplier to 1
            calculate();
        });

        powerInput.addEventListener('input', () => {
            lastPower = parseFloat(powerInput.value) || 6200.0; // Store the new power value
            multiplierInput.value = 1; // Reset multiplier to 1
            calculate();
        });

        multiplierInput.addEventListener('input', updateHashAndPower);
        costInput.addEventListener('input', updateHashAndPower);
        blockRewardInput.addEventListener('input', updateHashAndPower);
        feesInput.addEventListener('input', updateHashAndPower);
        blockTimeInput.addEventListener('input', updateHashAndPower);
        difficultyInput.addEventListener('input', updateHashAndPower);
        dogeValueInput.addEventListener('input', updateHashAndPower);
        minerCost.addEventListener('input', updateHashAndPower);
        additionalFunds.addEventListener('input', updateHashAndPower);
        targetMonths.addEventListener('input', updateHashAndPower);
        monthlyDifficultyIncreaseInput.addEventListener('input', updateHashAndPower);
        monthlyValueIncreaseInput.addEventListener('input', updateHashAndPower);
        deliveryChargeRateInput.addEventListener('input', updateHashAndPower);
        providerChargeInput.addEventListener('input', updateHashAndPower);
        existingMinersInput.addEventListener('input', updateHashAndPower);
        useDryCoolerFactoringCheckbox.addEventListener('input', updateHashAndPower);
        useRackFactoringCheckbox.addEventListener('input', updateHashAndPower);
        coolerCostInput.addEventListener('input', updateHashAndPower);
        coolerHeatTransferInput.addEventListener('input', updateHashAndPower);
        coolerPowerInput.addEventListener('input', updateHashAndPower);
        rackCostInput.addEventListener('input', updateHashAndPower);
        rackCapacityInput.addEventListener('input', updateHashAndPower);
        existingRacksInput.addEventListener('input', updateHashAndPower);
        
        function calculate() {
            // Get user inputs
            const hashRate = parseFloat(hashRateInput.value) / 1000; // Convert GH/s to TH/s
            const blockReward = parseFloat(document.getElementById('blockReward').value);
            const difficulty = parseFloat(document.getElementById('difficulty').value);
            const power = parseFloat(powerInput.value);
            const fees = parseFloat(document.getElementById('fees').value) / 100;
            const dogeValue = parseFloat(document.getElementById('dogeValue').value);
            const cost = parseFloat(document.getElementById('cost').value);
            const blockTime = parseFloat(document.getElementById('blockTime').value);
            const deliveryChargeRate = parseFloat(document.getElementById('deliveryChargeRate').value);
            const providerCharge = parseFloat(document.getElementById('providerCharge').value);
            
            // Calculate metrics
            const blockRewardHours = blockReward * 3600;
            const rewardsPerHourDOGE = (hashRate * blockRewardHours) / (difficulty * Math.pow(2, 32));
            const scaledRewardsPerHourDOGE = rewardsPerHourDOGE * Math.pow(10, 12); // Scale by 10^12
            const rewardsPerHourUSD = scaledRewardsPerHourDOGE * dogeValue;
            
            // Calculate electricity
            // const powerToKWH = ; // 5000W × 3h / 1000
            const deliveryCharge = (power / 1000) * deliveryChargeRate; // ((Units * kWh day) * days) * Variable rate
            const electricityCostPerHour = (power / 1000) * cost;
            const feesCostUSD = rewardsPerHourUSD * fees;
            const profitPerHourUSD = rewardsPerHourUSD - electricityCostPerHour - feesCostUSD - deliveryCharge;
            
            // Time periods
            const periods = { Hour: 1, Day: 24, Week: 168, Month: 720, Year: 8760 };
            
            // Generate results
            const results = Object.entries(periods).map(([period, multiplier]) => {
                const providerChargeForPeriod = period === "Year" ? providerCharge * 12 : providerCharge; // Monthly fixed charge scaled
                return `<tr>
                    <td>${period}</td>
                    <td>$${Number((feesCostUSD * multiplier).toFixed(2)).toLocaleString()}</td>
                    <td>${Number((scaledRewardsPerHourDOGE * multiplier).toFixed(2)).toLocaleString()} DOGE</td>
                    <td>$${Number((rewardsPerHourUSD * multiplier).toFixed(2)).toLocaleString()}</td>
                    <td>$${Number((electricityCostPerHour * multiplier).toFixed(2)).toLocaleString()}</td>
                    <td>$${Number((deliveryCharge * multiplier).toFixed(2)).toLocaleString()}</td>
                    <td>$${Number((profitPerHourUSD * multiplier - providerChargeForPeriod).toFixed(2)).toLocaleString()}</td>
                </tr>`
            }).join('');
        
            document.getElementById('results').innerHTML = results;
            
            // Calculate mining profitability
            calculateScalingProfitability();
        }
        
        function calculateScalingProfitability() {
            const power = parseFloat(document.getElementById('power').value);
            const minerCost = parseFloat(document.getElementById('minerCost').value);
            const additionalFunds = parseFloat(document.getElementById('additionalFunds').value);
            const targetMonths = parseInt(document.getElementById('targetMonths').value, 10);
            const monthlyDifficultyIncrease = parseFloat(document.getElementById('monthlyDifficultyIncrease').value);
            const monthlyValueIncrease = parseFloat(document.getElementById('monthlyValueIncrease').value);
            const providerCharge = parseFloat(document.getElementById('providerCharge').value);
            const existingMiners = parseFloat(document.getElementById('existingMiners').value);
            let difficulty = parseFloat(document.getElementById('difficulty').value);
            let dogeValue = parseFloat(document.getElementById('dogeValue').value);
            
            const useDryCoolerFactoring = document.getElementById('useDryCoolerFactoring').checked;
            const useRackFactoring = document.getElementById('useRackFactoring').checked;
            const coolerCost = parseFloat(document.getElementById('coolerCost').value);
            const coolerHeatTransfer = parseFloat(document.getElementById('coolerHeatTransfer').value);
            const coolerPower = parseFloat(document.getElementById('coolerPower').value);
            const rackCost = parseFloat(document.getElementById('rackCost').value);
            const rackCapacity = parseInt(document.getElementById('rackCapacity').value, 10);
            const existingRacks = parseFloat(document.getElementById('existingRacks').value);
            
            // const cellText = document.querySelector('#results tr:nth-child(4) td:last-child').textContent.trim();
            // const monthlyProductionPerMiner = parseFloat(cellText.replace('$', '').replace(',', '')) || 0;
            // console.log(monthlyProductionPerMiner);
        
            let currentMiners = existingMiners; // Start with a desired amount of miners
            let currentCoolers = 1;             // Start with a single cooler
            let currentRacks = existingRacks;   // Start with a desired amount of racks
            let equipmentCost = 0;
            let cumulativeRevenue = 0;
            let data = [];
            
            // Chart rendering logic
            const monthlyData = [];
        
            for (let month = 1; month <= targetMonths; month++) {
                const monthlyRevenue = currentMiners * (calculateRevenuePerHour(difficulty, dogeValue) * 720) - providerCharge;
                cumulativeRevenue += monthlyRevenue + additionalFunds;
                
                // Calculate the additonal equipment costs
                if (useDryCoolerFactoring) {
                    const requiredCoolers = Math.ceil((currentMiners * power) / (coolerHeatTransfer * 1000));
                    const requiredCoolersCost = requiredCoolers * coolerCost;
                    const additionalPowerCost = calculatePowerChargePerHour(coolerPower, requiredCoolers);
                    
                    // Check if the required cooler is greater then what already exists
                    if (requiredCoolers > currentCoolers)
                    {
                        cumulativeRevenue -= requiredCoolersCost;
                        currentCoolers = requiredCoolers;
                        
                        // Add to the equipment cost
                        equipmentCost += requiredCoolersCost;
                    }
                    
                    // Always subtract the price of the cooler
                    cumulativeRevenue -= additionalPowerCost;
                    
                    // Add to the equipment cost
                    equipmentCost += additionalPowerCost;
                }
                else
                {
                    // Ensure no coolers exist if disabled
                    currentCoolers = 0;
                }
                if (useRackFactoring) {
                    const requiredRacks = Math.ceil(currentMiners / rackCapacity);
                    const requiredRacksCost = requiredRacks * rackCost;
                    
                    // Check if the required racks is greater then what already exists
                    if (requiredRacks > currentRacks)
                    {
                        cumulativeRevenue -= requiredRacksCost;
                        currentRacks = requiredRacks;
                        
                        // Add to the equipment cost
                        equipmentCost += requiredRacksCost;
                    }
                }
                else
                {
                    // Ensure no coolers exist if disabled
                    currentRacks = 0;
                }
        
                // Calculate new miners that can be purchased
                const newMiners = Math.max(0, Math.floor(cumulativeRevenue / minerCost)); // Ensure newMiners is never negative
                cumulativeRevenue -= newMiners * minerCost;
                
                // Collect data for the table
                data.push({
                    month,
                    totalCoolers: currentCoolers,
                    totalRacks: currentRacks,
                    totalMiners: currentMiners,
                    newMiners: newMiners,
                    dogeValue: dogeValue,
                    monthlyProduction: Math.floor((currentMiners * (calculateRevenuePerHour(difficulty, dogeValue) * 720)) - providerCharge),
                    deliveryCost: Math.floor(calculateDeliveryChargePerHour(currentMiners) * 720),
                    annualProduction: Math.floor((currentMiners * (calculateRevenuePerHour(difficulty, dogeValue) * 8760)) - (providerCharge * 12)),
                    miningDifficulty: difficulty
                });
                
                // Collect data for the chart
                monthlyData.push({
                    annualProduction: Math.floor((currentMiners * (calculateRevenuePerHour(difficulty, dogeValue) * 8760)) - (providerCharge * 12)),
                    miningDifficulty: difficulty,
                    dogeValue: dogeValue,
                    deliveryCost: Math.floor(calculateDeliveryChargePerHour(currentMiners) * 8760),
                    equipmentCost: equipmentCost
                });
                
                // Update miner count
                currentMiners += newMiners;
                
                // Increase difficulty for the next month
                difficulty += monthlyDifficultyIncrease;
                
                // Increase doge value for the next month
                dogeValue += monthlyValueIncrease;
            }
        
            // Update the scaling results table
            const scalingResults = document.getElementById('scalingResults');
            scalingResults.innerHTML = data.map((row, index) => {
                const rowColor = (row.month % 12 === 0) ? 'background-color: #fffdab;' : ''; // Apply color to every 12th row; 12 === 1 for every 1, 13, exc.
                return `
                    <tr style="${rowColor}">
                        <td>${row.month}</td>
                        <td>${row.totalCoolers.toLocaleString()}</td>
                        <td>${row.totalRacks.toLocaleString()}</td>
                        <td>${row.totalMiners.toLocaleString()}</td>
                        <td>${row.newMiners.toLocaleString()}</td>
                        <td>${row.dogeValue.toLocaleString()}</td>
                        <td>$${row.monthlyProduction.toLocaleString()}</td>
                        <td>$${row.deliveryCost.toLocaleString()}</td>
                        <td>$${row.annualProduction.toLocaleString()}</td>
                        <td>${row.miningDifficulty.toLocaleString()}</td>
                    </tr>
                `;
            }).join('');
            
            // Add the Total Revenue row
            addTotalRevenueRow();
    
            // Update the scaling results chart
            renderChart(monthlyData);
        }
        
        function addTotalRevenueRow() {
            const scalingResultsTable = document.getElementById('scalingResults');
            const rows = scalingResultsTable.querySelectorAll('tr');
            let totalRevenue = 0;
        
            // Sum the values in the "Monthly Production ($)" column
            rows.forEach((row, index) => {
                if (index >= 0) { // Skip the header row
                    const monthlyProductionCell = row.cells[6]; // 7th column (0-based index)
                    const monthlyProductionCellTrimmed = parseFloat(monthlyProductionCell.textContent.replace(/[$,]/g, '')) || 0;
                    // console.log(monthlyProductionCell.textContent.replace(/[$,]/g, ''));
                    
                    if (monthlyProductionCell) {
                        const value = monthlyProductionCellTrimmed || 0;
                        totalRevenue += value;
                    }
                }
            });
        
            // Remove existing "Total Revenue" row if it exists
            const existingTotalRow = document.getElementById('totalRevenueRow');
            if (existingTotalRow) {
                scalingResultsTable.removeChild(existingTotalRow);
            }
        
            // Create and append the "Total Revenue" row
            const totalRow = document.createElement('tr');
            totalRow.id = 'totalRevenueRow';
            totalRow.innerHTML = `
                <td colspan="6"><strong>Total Revenue Generated:</strong></td>
                <td colspan="4"><strong>$${Number(totalRevenue.toFixed(2)).toLocaleString()}</strong></td>
            `;
            scalingResultsTable.appendChild(totalRow);
        }

        // Helper function to calculate rewards per hour
        function calculateRevenuePerHour(difficulty, dogeValue) {
            const multiplierInput = document.getElementById('multiplier'); // Divide by multiplier to always represent one unit
            const power = parseFloat(powerInput.value / multiplierInput.value);
            const hashRate = parseFloat(hashRateInput.value / multiplierInput.value) / 1000; // Convert GH/s to TH/s
            const blockReward = parseFloat(document.getElementById('blockReward').value);
            const fees = parseFloat(document.getElementById('fees').value) / 100;
            const cost = parseFloat(document.getElementById('cost').value);
            const deliveryChargeRate = parseFloat(document.getElementById('deliveryChargeRate').value);
            
            // Calculate rewards per hour based on total miners, difficulty, and block reward
            const blockRewardHours = blockReward * 3600;
            const rewardsPerHourDOGE = (hashRate * blockRewardHours) / (difficulty * Math.pow(2, 32));
            const scaledRewardsPerHourDOGE = rewardsPerHourDOGE * Math.pow(10, 12); // Scale by 10^12
            const rewardsPerHourUSD = scaledRewardsPerHourDOGE * dogeValue;
            
            // Calculate electricity
            // const powerToKWH = ; // 5000W × 3h / 1000
            const deliveryCharge = (power / 1000) * deliveryChargeRate; // ((Units * kWh day) * days) * Variable rate
            const electricityCostPerHour = (power / 1000) * cost;
            const feesCostUSD = rewardsPerHourUSD * fees;
            const profitPerHourUSD = rewardsPerHourUSD - electricityCostPerHour - feesCostUSD - deliveryCharge;
            
            return profitPerHourUSD;
        }
        
        // Helper function to calculate rewards per hour
        function calculateDeliveryChargePerHour(currentMiners) {
            const power = parseFloat(powerInput.value / multiplierInput.value);
            const deliveryChargeRate = parseFloat(document.getElementById('deliveryChargeRate').value);
            
            // Calculate electricity
            // const powerToKWH = ; // 5000W × 3h / 1000
            // ((((power / 1000) * deliveryChargeRate) * 24 hours) * 30 days) * currentMiners
            const deliveryChargePerHourUSD = ((power / 1000) * deliveryChargeRate) * currentMiners;
            
            return deliveryChargePerHourUSD;
        }
        
        // Helper function to calculate rewards per hour
        function calculatePowerChargePerHour(powerInput, unitsInput) {
            const deliveryChargeRate = parseFloat(document.getElementById('deliveryChargeRate').value);
            
            // Calculate electricity
            // const powerToKWH = ; // 5000W × 3h / 1000
            // ((((power / 1000) * deliveryChargeRate) * 24 hours) * 30 days) * currentMiners
            const powerChargePerHourUSD = ((powerInput / 1000) * deliveryChargeRate) * unitsInput;
            
            return powerChargePerHourUSD;
        }
    
        updateDataButton.addEventListener('click', async () => {
        
            // Disable the button to prevent further clicks
            updateDataButton.disabled = true;
    
            try {
                const useBlockAverage = useBlockAverageCheckbox.checked;
        
                // Fetch the latest DOGE blocks
                const response = await fetch('https://api.blockchair.com/dogecoin/blocks?limit=60');
                const data = await response.json();
                const dogePrice = data.context.market_price_usd;
        
                // Determine which blocks to use based on the checkbox
                let totalDifficulty = 0;
                let blockCount = useBlockAverage ? data.data.length : 1; // Use all blocks or just the most recent block
        
                // Calculate the total difficulty based on the selected blocks
                for (let i = 0; i < blockCount; i++) {
                    totalDifficulty += data.data[i].difficulty;
                    // console.log(data.data[i].difficulty);
                }
        
                // Calculate the average difficulty if using the last 10 blocks
                const averageDifficulty = totalDifficulty / blockCount;
                
                // Debugging
                // console.log(`DOGE Price: ${dogePrice.toFixed(6)} USD`);
                // console.log(`Average Difficulty: ${averageDifficulty.toFixed(2)}`);
                
                // Update the inputs with the fetched data
                dogeValueInput.value = dogePrice.toFixed(6);
                difficultyInput.value = averageDifficulty.toFixed(2);
        
                // Recalculate the numbers with the new data
                calculate();
            } catch (error) {
                console.error('Error fetching DOGE data. Might have attempted to fetch too many too quickly! Error:', error);
            } finally {
                // Re-enable the button after the task is completed
                updateDataButton.disabled = false;
            }
        });
        
        // Function to toggle enabled state of inputs in the group
        function toggleGroupBoxEnabledState(groupId, isEnabled) {
            const groupBox = document.getElementById(groupId);
            const inputs = groupBox.querySelectorAll('input[type="number"]');
            inputs.forEach(input => {
                input.disabled = !isEnabled;
            });
        }
